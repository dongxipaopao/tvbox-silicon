name: simulator-shots
on:
  workflow_dispatch:
jobs:
  runtime-sim:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore runtime cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/apple-runtime
            build/AppleRuntime
            build/JavaHost
          key: runtime-sim-v1-${{ github.run_id }}
          restore-keys: runtime-sim-v1-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
      - name: Tools
        run: brew install xcodegen maven autoconf automake libtool cmake ninja meson 2>&1 | tail -3 || true
      - name: Java host
        run: Scripts/build-java-host.sh
      - name: Apple runtime (iOS simulator)
        run: Scripts/package-apple-runtime.sh ios-simulator 2>&1 | tee runtime.log | tail -200
      - name: Save runtime cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/apple-runtime
            build/AppleRuntime
            build/JavaHost
          key: runtime-sim-v1-${{ github.run_id }}
      - name: Pack runtime
        if: success()
        run: tar -C build -cf runtime.tar AppleRuntime JavaHost
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: runtime-sim
          path: runtime.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-sim-log
          path: runtime.log
          if-no-files-found: ignore
  shots:
    needs: runtime-sim
    runs-on: xcode-27
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-sim
      - run: mkdir -p build && tar -C build -xf runtime.tar
      - name: Select newest Xcode
        run: |
          best=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
      - name: Tools
        run: brew install xcodegen meson ninja ffmpeg 2>&1 | tail -2 || true
      - name: Restore FFmpeg cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg
            ~/Library/Caches/tvbox-libass
          key: ffmpeg-v1-${{ hashFiles('Scripts/build-apple-ffmpeg.sh', 'Scripts/build-apple-libass.sh') }}
      - name: FFmpeg and libass
        run: |
          Scripts/build-apple-ffmpeg.sh
          Scripts/build-apple-libass.sh
      - name: Generate project
        run: |
          mkdir -p build/ScriptHost build/PythonHost
          xcodegen generate
      - name: Build Debug for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project TVBox.xcodeproj -scheme TVBox-iOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DDsim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee sim-build.log | tail -40
      - name: Show compile errors
        if: failure()
        run: grep -E 'error:' sim-build.log | sort -u | head -300 || true
      - name: Boot simulator and take screenshots
        run: |
          set -x
          mkdir -p shots build/LibraryUI
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']]
          pro=[x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']]
          print((pro or c)[-1]['udid'])")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/DDsim/Build/Products -maxdepth 2 -name '*.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=640x360:rate=24' -f lavfi -i 'sine=frequency=440' -t 300 -c:v libx264 -preset ultrafast -g 48 -c:a aac -movflags +faststart build/LibraryUI/clip.mp4
          cp build/LibraryUI/clip.mp4 build/LibraryUI/portrait.mp4
          python3 Scripts/qa-server.py --port 8765 --media build/LibraryUI/clip.mp4 > qa-server.log 2>&1 &
          sleep 2
          B=com.jo32.yingxia.ios
          SUB=http://127.0.0.1:8765/config.json
          shot() { name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" $B 2>/dev/null || true
            xcrun simctl launch "$UDID" $B -qaIsolatedData 1 -qaSubscription "$SUB" "$@" || true
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png" || true
          }
          shot 01-home 25 -qaSection home
          shot 02-discover 25 -qaSection discover
          shot 03-music 15 -qaSection music
          shot 04-sources 20 -qaSection sites
          shot 05-search 25 -qaSection search -qaPage search:测试
          shot 06-favorites 12 -qaSection favorites
          shot 07-history 25 -qaSection history -qaSeedHistory qa-standard:1,qa-standard:2
          shot 08-settings 12 -qaSection settings
          shot 09-detail-episodes-lines 30 -qaSection sites -qaPage detail:qa-standard:1
          shot 10-source-site 25 -qaSection sites -qaPage site:qa-standard
          shot 11-playback 40 -qaSection home -qaPage play-source:qa-standard
          shot 12-more 12 -qaSection more
          xcrun simctl terminate "$UDID" $B || true
          # The user's own source address, as a second pass (no fixture server).
          REAL='https://gh-proxy.cc/https://raw.githubusercontent.com/aaaaa2780009/cat-bundle/main/cat/index.js.md5'
          SUB="$REAL"
          shot 20-real-home 60 -qaSection home
          shot 21-real-sources 40 -qaSection sites
          ls -l shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-shots
          path: |
            shots
            qa-server.log
            sim-build.log
          if-no-files-found: ignore
