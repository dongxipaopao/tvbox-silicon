          print((pro or c)[-1]['udid'])")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/DDsim/Build/Products -maxdepth 2 -name '*.app' | head -1)
