name: build-ios
on:
  workflow_dispatch:
jobs:
  runtime:
    if: false
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore runtime cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/apple-runtime
            build/AppleRuntime
            build/JavaHost
          key: runtime-v1-${{ github.run_id }}
          restore-keys: runtime-v1-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
      - name: Tools
        run: brew install xcodegen maven autoconf automake libtool cmake ninja meson 2>&1 | tail -3 || true
      - name: Java host
        run: Scripts/build-java-host.sh
      - name: Apple runtime (iOS device)
        run: Scripts/package-apple-runtime.sh ios 2>&1 | tee runtime.log | tail -200
      - name: Save runtime cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/apple-runtime
            build/AppleRuntime
            build/JavaHost
          key: runtime-v1-${{ github.run_id }}
      - name: Pack runtime
        if: success()
        run: tar -C build -cf runtime.tar AppleRuntime JavaHost
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: runtime
          path: runtime.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-log
          path: runtime.log
          if-no-files-found: ignore
  ipa:
    runs-on: xcode-27
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      # The runtime tarball from run 45780599022 (same Java host and runtime scripts) is reused: the macos-15 pool did not pick the rebuild up.
      - uses: actions/download-artifact@v4
        with:
          name: runtime
          run-id: 45819094996
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p build && tar -C build -xf runtime.tar
      - name: Select newest Xcode (27 beta on the xcode-27 image)
        run: |
          ls -d /Applications/Xcode_*.app || true
          best=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $best"
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Tools
        run: brew install xcodegen meson ninja 2>&1 | tail -2 || true
      - name: Restore FFmpeg cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg
            ~/Library/Caches/tvbox-libass
          key: ffmpeg-v1-${{ hashFiles('Scripts/build-apple-ffmpeg.sh', 'Scripts/build-apple-libass.sh') }}
      - name: FFmpeg and libass
        run: |
          Scripts/build-apple-ffmpeg.sh
          Scripts/build-apple-libass.sh
      - name: Save FFmpeg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg
            ~/Library/Caches/tvbox-libass
          key: ffmpeg-v1-${{ hashFiles('Scripts/build-apple-ffmpeg.sh', 'Scripts/build-apple-libass.sh') }}
      - name: Restore Python cache
        uses: actions/cache/restore@v4
        with:
          path: build/apple-python
          key: python-v1-${{ hashFiles('Scripts/build-apple-python.sh', 'Scripts/build-apple-python-wheels.sh', 'Runtime/PythonHost/requirements.txt') }}
      - name: Python runtime (iOS device)
        continue-on-error: true
        run: |
          brew install python@3.14 2>&1 | tail -3 || true
          export HOST_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
          Scripts/build-apple-python.sh ios 2>&1 | tee python.log | tail -80
          ls build/ApplePython/iphoneos | head
      - name: Save Python cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/apple-python
          key: python-v1-${{ hashFiles('Scripts/build-apple-python.sh', 'Scripts/build-apple-python-wheels.sh', 'Runtime/PythonHost/requirements.txt') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-log
          path: python.log
          if-no-files-found: ignore
      - name: Generate project
        run: |
          mkdir -p build/ScriptHost build/PythonHost
          xcodegen generate
      - name: Archive unsigned
        run: |
          set -o pipefail
          xcodebuild -project TVBox.xcodeproj -scheme TVBox-iOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild.log | tail -60
      - name: Show compile errors
        if: failure()
        run: grep -E 'error:' xcodebuild.log | sort -u | head -600 || true
      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products -maxdepth 2 -name '*.app' | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Yingxia-custom-unsigned.ipa Payload
          ls -l Yingxia-custom-unsigned.ipa
      - name: Verify IPA contents
        run: |
          set +o pipefail
          rm -rf /tmp/ipachk && mkdir /tmp/ipachk && unzip -q Yingxia-custom-unsigned.ipa -d /tmp/ipachk
          A=$(ls -d /tmp/ipachk/Payload/*.app)
          {
            echo "ipa sha256: $(shasum -a 256 Yingxia-custom-unsigned.ipa | cut -d' ' -f1)"
            echo "ipa bytes: $(stat -f%z Yingxia-custom-unsigned.ipa)"
            echo "source commit: ${{ github.sha }}"
            echo "app: $A"
            for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion UIDeviceFamily DTPlatformName DTSDKName DTPlatformVersion UIRequiredDeviceCapabilities; do
              echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$A/Info.plist" 2>&1 | tr '\n' ' ')"
            done
            EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$A/Info.plist")
            echo "executable: $EXE"
            lipo -info "$A/$EXE"
            vtool -show-build "$A/$EXE" | head -12
            echo "--- bundle top level"; ls -la "$A" | head -60
            echo "--- frameworks"; ls "$A/Frameworks" 2>/dev/null | head -40
            echo "--- biggest files"; find "$A" -type f -exec stat -f '%z %N' {} + | sort -rn | head -25
            echo "--- file count: $(find "$A" -type f | wc -l)"
            echo "--- codesign"; codesign -dv "$A" 2>&1 | head -5 || true
          } 2>&1 | tee ipa-verify.txt
          grep -q "arm64" ipa-verify.txt
      - name: Name IPA into ipa/ (version, build, commit, platform)
        run: |
          A=$(ls -d /tmp/ipachk/Payload/*.app)
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$A/Info.plist")
          B=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$A/Info.plist")
          mkdir -p ipa
          cp Yingxia-custom-unsigned.ipa "ipa/Yingxia-${V}-b${B}-$(echo ${{ github.sha }} | cut -c1-7)-ios-unsigned.ipa"
          ls -l ipa; (cd ipa && shasum -a 256 *.ipa) | tee ipa-named.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-named
          path: |
            ipa/*.ipa
            ipa-named.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-verify
          path: ipa-verify.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Yingxia-custom-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-log
          path: xcodebuild.log
          if-no-files-found: ignore
      - name: Logic tests (SourceFailover)
        run: |
          set -o pipefail
          swift test --filter SourceFailoverTests 2>&1 | tee tests.log | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-log
          path: tests.log
          if-no-files-found: ignore
      - name: Full TVCore tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          swift test 2>&1 | tee tests-full.log | tail -60
      - name: Retry failed tests one by one
        if: always()
        continue-on-error: true
        run: |
          grep -oE "✘ Test [A-Za-z0-9_]+\(\) failed" tests-full.log | awk '{print $3}' | sed 's/()//' | sort -u > failed-names.txt || true
          cat failed-names.txt
          : > tests-retry.log
          while read -r n; do
            [ -z "$n" ] && continue
            echo "=== $n" | tee -a tests-retry.log
            swift test --filter "$n" 2>&1 | grep -E "Test run with|✘|✔ Test $n|Caught error|Expectation failed" | tee -a tests-retry.log
          done < failed-names.txt
      - name: Test summary
        if: always()
        run: grep -E "Test run with|Executed [0-9]+ tests|✘|Suite .* (passed|failed)|^===" tests.log tests-full.log tests-retry.log | tail -120 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-full-log
          path: |
            tests-full.log
            tests-retry.log
          if-no-files-found: ignore
