name: inspect-artifacts
on:
  workflow_dispatch:
    inputs:
      ios_run:
        default: "45855635820"
      tvos_run:
        default: "45855741799"
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ipa-verify
          run-id: ${{ inputs.ios_run }}
          github-token: ${{ github.token }}
          path: v-ios
      - uses: actions/download-artifact@v4
        with:
          name: ipa-tvos-verify
          run-id: ${{ inputs.tvos_run }}
          github-token: ${{ github.token }}
          path: v-tvos
      - uses: actions/download-artifact@v4
        with:
          name: python-log
          run-id: ${{ inputs.ios_run }}
          github-token: ${{ github.token }}
          path: v-py
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: ipa-named
          run-id: ${{ inputs.ios_run }}
          github-token: ${{ github.token }}
          path: named-ios
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: tests-full-log
          run-id: ${{ inputs.ios_run }}
          github-token: ${{ github.token }}
          path: t-full
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: tests-log
          run-id: ${{ inputs.ios_run }}
          github-token: ${{ github.token }}
          path: t-log
        continue-on-error: true
      - name: Test counts
        continue-on-error: true
        run: |
          { echo "## retry-all (iOS run ${{ inputs.ios_run }})"; echo '```'; R=t-full/tests-retry.log; echo "retry runs passed: $(grep -a -c '^✔ Test run with' $R)  failed: $(grep -a -c '^✘ Test run with' $R)"; echo "-- failed test lines"; grep -a '^✘ Test ' $R | grep -a -v 'Test run with' | grep -a 'failed after' | sort | uniq | cut -c1-200; echo "-- issues"; grep -a 'recorded an issue' $R | sort | uniq | cut -c1-300; echo "-- full run failing tests"; grep -a '^✘ Test ' t-full/tests-full.log | grep -a 'failed after' | sort | uniq | cut -c1-200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test summary
        continue-on-error: true
        run: |
          mkdir -p pub-tests
          R=t-full/tests-retry.log
          { echo "# Test summary (iOS run ${{ inputs.ios_run }}, inspect run ${{ github.run_id }})"; echo; echo "retry runs passed: $(grep -a -c '^✔ Test run with' $R || true)  failed: $(grep -a -c '^✘ Test run with' $R || true)"; echo; echo "## failed test lines (retry)"; grep -a '^✘ Test ' $R | grep -a -v 'Test run with' | grep -a 'failed after' | sort | uniq | cut -c1-200 || true; echo; echo "## issues (retry)"; grep -a 'recorded an issue' $R | sort | uniq | cut -c1-300 || true; echo; echo "## full run failing tests"; grep -a '^✘ Test ' t-full/tests-full.log | grep -a 'failed after' | sort | uniq | cut -c1-200 || true; echo; echo "## full run verdict"; grep -aE 'Test run with [0-9]+ tests' t-full/tests-full.log | tail -2 || true; } > pub-tests/summary.md
          cat pub-tests/summary.md
          cd pub-tests && git init -q && git checkout -qb tests-evidence && git config user.name ci && git config user.email ci@users.noreply.github.com && git add -A && git commit -qm "test summary of run ${{ inputs.ios_run }}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tests-evidence
      - name: Icons actually packed (iOS)
        continue-on-error: true
        run: |
          ls -R named-ios | head -20; IPA=$(find named-ios -name "*.ipa" | head -1); echo "ipa=$IPA"; rm -rf x && mkdir x && unzip -q "$IPA" -d x
          A=$(ls -d x/Payload/*.app)
          mkdir -p pub && cp "$A"/AppIcon*.png pub/ || true
          { echo "## iOS packed icons"; echo '```'; ls -l "$A"/AppIcon*.png; file "$A"/AppIcon*.png; python3 -c "import plistlib,sys;p=plistlib.load(open(sys.argv[1],'rb'));[print(k,'=',p.get(k)) for k in ['CFBundleIdentifier','CFBundleDisplayName','CFBundleIcons','CFBundleIcons~ipad','CFBundleURLTypes']]" "$A/Info.plist"
          echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cd pub && git init -q && git checkout -qb icons-evidence && git config user.name ci && git config user.email ci@users.noreply.github.com && git add -A && git commit -qm "packed icons of run ${{ inputs.ios_run }}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" icons-evidence
      - name: Show
        run: |
          {
            echo "## iOS verify (run ${{ inputs.ios_run }})"; echo '```'; head -c 6000 v-ios/*.txt; echo '```'
            echo "## tvOS verify (run ${{ inputs.tvos_run }})"; echo '```'; head -c 6000 v-tvos/*.txt; echo '```'
            echo "## python-log"; echo '```'; head -c 1500 v-py/* 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -R v-ios v-tvos v-py | head -20
