name: build-tvos
on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: "Reuse runtime-tvos from this earlier run id (blank builds it)"
        required: false
        default: ""
jobs:
  runtime-tvos:
    if: ${{ inputs.runtime_run_id == '' }}
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore runtime cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/apple-runtime
            build/AppleRuntime
            build/JavaHost
          key: runtime-tvos-v1-${{ github.run_id }}
          restore-keys: |
            runtime-tvos-v1-
            runtime-v1-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
      - name: Tools
        run: brew install xcodegen maven autoconf automake libtool cmake ninja meson 2>&1 | tail -3 || true
      - name: Java host
        run: Scripts/build-java-host.sh
      - name: Apple runtime (tvOS device)
        run: Scripts/package-apple-runtime.sh tvos 2>&1 | tee runtime.log | tail -200
      - name: Save runtime cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/apple-runtime
            build/AppleRuntime
            build/JavaHost
          key: runtime-tvos-v1-${{ github.run_id }}
      - name: Pack runtime
        if: success()
        run: tar -C build -cf runtime.tar AppleRuntime JavaHost
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: runtime-tvos
          path: runtime.tar
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-tvos-log
          path: runtime.log
          if-no-files-found: ignore
  ipa-tvos:
    needs: runtime-tvos
    if: ${{ always() && (needs.runtime-tvos.result == 'success' || needs.runtime-tvos.result == 'skipped') }}
    runs-on: xcode-27
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-tvos
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p build && tar -C build -xf runtime.tar
      - name: Select newest Xcode (27 beta on the xcode-27 image)
        run: |
          ls -d /Applications/Xcode_*.app || true
          best=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $best"
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Tools
        run: brew install xcodegen meson ninja 2>&1 | tail -2 || true
      - name: Restore FFmpeg cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg
            ~/Library/Caches/tvbox-libass
          key: ffmpeg-v1-${{ hashFiles('Scripts/build-apple-ffmpeg.sh', 'Scripts/build-apple-libass.sh') }}
      - name: FFmpeg and libass
        run: |
          Scripts/build-apple-ffmpeg.sh
          Scripts/build-apple-libass.sh
      - name: Save FFmpeg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg
            ~/Library/Caches/tvbox-libass
          key: ffmpeg-v1-${{ hashFiles('Scripts/build-apple-ffmpeg.sh', 'Scripts/build-apple-libass.sh') }}
      - name: Generate project
        run: |
          mkdir -p build/ScriptHost build/PythonHost
          xcodegen generate
      - name: Archive unsigned
        run: |
          set -o pipefail
          xcodebuild -project TVBox.xcodeproj -scheme TVBox-tvOS -configuration Release \
            -destination 'generic/platform=tvOS' -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild-tvos.log | tail -60
      - name: Show compile errors
        if: failure()
        run: grep -E 'error:' xcodebuild-tvos.log | sort -u | head -600 || true
      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products -maxdepth 2 -name '*.app' | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Yingxia-tvOS-unsigned.ipa Payload
          ls -l Yingxia-tvOS-unsigned.ipa
      - name: Verify IPA contents
        run: |
          set -o pipefail
          rm -rf /tmp/ipachk && mkdir /tmp/ipachk && unzip -q Yingxia-tvOS-unsigned.ipa -d /tmp/ipachk
          A=$(ls -d /tmp/ipachk/Payload/*.app)
          {
            echo "ipa sha256: $(shasum -a 256 Yingxia-tvOS-unsigned.ipa | cut -d' ' -f1)"
            echo "ipa bytes: $(stat -f%z Yingxia-tvOS-unsigned.ipa)"
            echo "source commit: ${{ github.sha }}"
            echo "app: $A"
            for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion UIDeviceFamily DTPlatformName DTSDKName DTPlatformVersion UIRequiredDeviceCapabilities; do
              echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$A/Info.plist" 2>&1 | tr '\n' ' ')"
            done
            EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$A/Info.plist")
            echo "executable: $EXE"
            lipo -info "$A/$EXE"
            vtool -show-build "$A/$EXE" | head -12
            echo "--- bundle top level"; ls -la "$A" | head -60
            echo "--- frameworks"; ls "$A/Frameworks" 2>/dev/null | head -40
            echo "--- biggest files"; find "$A" -type f -exec stat -f '%z %N' {} + | sort -rn | head -25
            echo "--- file count: $(find "$A" -type f | wc -l)"
            echo "--- codesign"; codesign -dv "$A" 2>&1 | head -5 || true
          } 2>&1 | tee ipa-tvos-verify.txt
          grep -q "arm64" ipa-tvos-verify.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-tvos-verify
          path: ipa-tvos-verify.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-tvos
          path: Yingxia-tvOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-tvos-log
          path: xcodebuild-tvos.log
          if-no-files-found: ignore
