name: share-ipa
on:
  workflow_dispatch:
    inputs:
      ios_run:
        default: "45855741799"
permissions:
  actions: read
  contents: read
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ipa-named
          run-id: ${{ inputs.ios_run }}
          github-token: ${{ github.token }}
          path: named
      - name: Upload to free hosts and verify
        run: |
          IPA=$(find named -name '*.ipa' | head -1); ls -l "$IPA"; sha256sum "$IPA" > sum.txt
          S=$(cut -d' ' -f1 sum.txt)
          { echo "## share-ipa"; echo "file: $(basename $IPA)"; echo "bytes: $(stat -c %s $IPA)"; echo "sha256: $S"; } >> "$GITHUB_STEP_SUMMARY"
          # gofile
          GF=$(curl -s --max-time 900 -F "file=@$IPA" https://upload.gofile.io/uploadfile || true)
          echo "gofile: $(echo "$GF" | python3 -c "import json,sys;d=json.load(sys.stdin)[\"data\"];print(d[\"downloadPage\"],d[\"id\"],d[\"name\"],d[\"md5\"],d[\"guestToken\"])")" >> "$GITHUB_STEP_SUMMARY"
